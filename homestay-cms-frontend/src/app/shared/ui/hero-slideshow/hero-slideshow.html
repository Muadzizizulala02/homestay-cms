@if (count() > 0) {
  <div class="slides">
    @for (src of slides(); track $index; let i = $index) {
      <img
        class="slide"
        [class.active]="i === current()"
        [class.instant]="reducedMotion()"
        [src]="src"
        alt=""
        [attr.loading]="i === 0 ? 'eager' : 'lazy'"
        [attr.fetchpriority]="i === 0 ? 'high' : null"
      />
    }
  </div>

  @if (multiple()) {
    <!--
      Nothing is shown over the photo. The one control is kept for keyboard and screen-reader
      users (moving content must be pausable): it is invisible until it receives focus.
    -->
    <div class="controls" role="group" [attr.aria-label]="i18n.t('slideshow.controls')">
      <button
        type="button"
        class="toggle"
        [attr.aria-label]="paused() ? i18n.t('slideshow.play') : i18n.t('slideshow.pause')"
        (click)="togglePause()"
      >
        <mat-icon aria-hidden="true">{{ paused() ? 'play_arrow' : 'pause' }}</mat-icon>
      </button>
    </div>
  }
}
